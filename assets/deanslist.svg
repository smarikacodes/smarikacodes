<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" color="#1E3A8A">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFDBFE"><animate attributeName="stop-color" values="#BFDBFE;#A5F3FC;#C7D2FE;#BFDBFE" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#A5F3FC"><animate attributeName="stop-color" values="#A5F3FC;#C7D2FE;#BFDBFE;#A5F3FC" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="340" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="340" height="120" fill="url(#bg)"/>
    <circle cx="310" cy="-10" r="60" fill="#fff" opacity=".35"/>
    <circle cx="330" cy="140" r="45" fill="#fff" opacity=".25"/>
    <rect x="-120" y="-20" width="80" height="160" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;460" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(48,60)">
    <circle r="30" fill="#fff" fill-opacity=".6">
      <animate attributeName="r" values="28;32;28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="currentColor"><path d="M0,-14 L22,-4 L0,6 L-22,-4 z"/><path d="M-12,1 v8 a12,5 0 0 0 24,0 v-8 L0,6 z"/><path d="M20,-3 v12" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="11" r="2.5"/></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1E3A8A">
    <text x="92" y="42" font-size="11" font-weight="700" letter-spacing="2" fill-opacity=".7">DEAN&#39;S LIST</text>
    <text x="92" y="66" font-size="16" font-weight="700">Every semester</text>
    <text x="92" y="88" font-size="11.5" fill-opacity=".8">2023 to 2026 · WGPA above 3.5</text>
  </g>
</svg>
