<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" color="#4C1D95">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"><animate attributeName="stop-color" values="#E9D5FF;#FBCFE8;#FDE68A;#E9D5FF" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#FBCFE8"><animate attributeName="stop-color" values="#FBCFE8;#FDE68A;#E9D5FF;#FBCFE8" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="340" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="340" height="120" fill="url(#bg)"/>
    <circle cx="310" cy="-10" r="60" fill="#fff" opacity=".35"/>
    <circle cx="330" cy="140" r="45" fill="#fff" opacity=".25"/>
    <rect x="-120" y="-20" width="80" height="160" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;460" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(48,60)">
    <circle r="30" fill="#fff" fill-opacity=".6">
      <animate attributeName="r" values="28;32;28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="currentColor"><path d="M-14,-16 h28 v8 a14,14 0 0 1 -28,0 z" /><path d="M-14,-12 h-6 a6,6 0 0 0 6,10" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14,-12 h6 a6,6 0 0 1 -6,10" fill="none" stroke="currentColor" stroke-width="3"/><rect x="-3" y="6" width="6" height="7"/><rect x="-10" y="13" width="20" height="4" rx="2"/></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#4C1D95">
    <text x="92" y="42" font-size="11" font-weight="700" letter-spacing="2" fill-opacity=".7">WINNER</text>
    <text x="92" y="66" font-size="16" font-weight="700">Varicon Hackathon 2026</text>
    <text x="92" y="88" font-size="11.5" fill-opacity=".8">Multi-agent bulk import</text>
  </g>
</svg>
