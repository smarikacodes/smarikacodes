<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" color="#14532D">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BBF7D0"><animate attributeName="stop-color" values="#BBF7D0;#D9F99D;#FEF08A;#BBF7D0" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#D9F99D"><animate attributeName="stop-color" values="#D9F99D;#FEF08A;#BBF7D0;#D9F99D" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="340" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="340" height="120" fill="url(#bg)"/>
    <circle cx="310" cy="-10" r="60" fill="#fff" opacity=".35"/>
    <circle cx="330" cy="140" r="45" fill="#fff" opacity=".25"/>
    <rect x="-120" y="-20" width="80" height="160" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;460" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(48,60)">
    <circle r="30" fill="#fff" fill-opacity=".6">
      <animate attributeName="r" values="28;32;28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="currentColor"><path d="M-10,-18 L-4,-2 L4,-2 L10,-18 L4,-18 L0,-8 L-4,-18 z"/><circle cx="0" cy="8" r="11"/><path d="M0,1 l2.2,4.5 5,.7 -3.6,3.5 .9,5 -4.5,-2.4 -4.5,2.4 .9,-5 -3.6,-3.5 5,-.7 z" fill="#BBF7D0"/></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#14532D">
    <text x="92" y="42" font-size="11" font-weight="700" letter-spacing="2" fill-opacity=".7">SCHOLARSHIP</text>
    <text x="92" y="66" font-size="16" font-weight="700">Academic Excellence 2024</text>
    <text x="92" y="88" font-size="11.5" fill-opacity=".8">Taylor&#39;s University</text>
  </g>
</svg>
